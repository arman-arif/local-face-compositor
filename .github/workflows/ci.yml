name: CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.26.4" \
            "opencv-python-headless==4.10.0.84" \
            "onnxruntime==1.20.1" \
            "fastapi>=0.115,<1.0" \
            "python-multipart>=0.0.9" \
            "pytest>=8,<9"
      - name: Compile Python sources
        run: python -m compileall -q app.py face_swap_models.py scripts/benchmark-models.py
      - name: Check downloader shell syntax
        run: bash -n scripts/download-models.sh
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/local-face-compositor.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/local-face-compositor.js
      - name: Run unit tests (no model weights required)
        run: pytest -q
